author: "UEDCommander"
delete-after: True
changes:
  - rscadd: "Добавлен подкласс Oathbreaker для Иконокласта - темное зеркало храмовых тамплиеров, что ведет своих товарищей к победе над Тиранией Солнца."
  - rscadd: "Специально для нового подкласса добавлена вариация маттиоситского Rite of Armaments, призывающая меч Kingslayer. Использовать этот ритуал и создаваемый им меч может только Клятвоотступник."
  - rscadd: "Магазин иконокласта у дракона расширен, чтобы учесть потребности нового подкласса."